[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG pipeline with Hybrid Search for Internal Company Documentation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.4",
    "pypdf>=4.3",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "openai>=1.40",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_pipeline --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
extend-exclude = ["data/sample"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rag_pipeline"]
strict = true

[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true
